version: 1
disable_existing_loggers: false
formatters:
  plain:
    format: "%(asctime)s %(levelname)s %(name)s: %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    formatter: plain
root:
  level: INFO
  handlers: [console]
# Per-inference audit records are NOT written through this config; see cxr_reliability.audit.
